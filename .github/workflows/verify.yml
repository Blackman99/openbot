          test "$bot_immutable_update_privileges" = 'f,f'

          conversation_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(table_name || ':' || concat_ws(',', has_table_privilege('openbot_runtime', table_name, 'SELECT'), has_table_privilege('openbot_runtime', table_name, 'INSERT'), has_table_privilege('openbot_runtime', table_name, 'UPDATE'), has_table_privilege('openbot_runtime', table_name, 'DELETE'), has_table_privilege('openbot_runtime', table_name, 'TRUNCATE')), ';' ORDER BY table_name) FROM (VALUES ('conversations'), ('conversation_events')) AS ledger_tables(table_name)")"
          test "$conversation_table_privileges" = 'conversation_events:t,t,f,f,f;conversations:t,t,f,f,f'
          conversation_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(column_name || ':' || has_column_privilege('openbot_runtime', 'conversations', column_name, 'UPDATE')::text, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='public' AND table_name='conversations'")"
          test "$conversation_update_privileges" = 'bot_id:false,created_at:false,creator_user_id:false,group_id:false,id:false,last_sequence:true,workspace_id:false'
          conversation_guard_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_any_column_privilege('openbot_runtime', 'conversation_events', 'UPDATE'), has_function_privilege('openbot_runtime', 'reject_conversation_event_mutation()', 'EXECUTE'), has_function_privilege('openbot_runtime', 'protect_conversation_subject()', 'EXECUTE'))")"
          test "$conversation_guard_privileges" = 'f,f,f'
          group_bot_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_table_privilege('openbot_runtime','group_bot_grants','SELECT'), has_table_privilege('openbot_runtime','group_bot_grants','INSERT'), has_table_privilege('openbot_runtime','group_bot_grants','UPDATE'), has_table_privilege('openbot_runtime','group_bot_grants','DELETE'), has_table_privilege('openbot_runtime','group_bot_grants','TRUNCATE'), has_function_privilege('openbot_runtime','protect_group_bot_grant()','EXECUTE'))")"
          test "$group_bot_table_privileges" = 't,t,f,f,f,f'
          group_bot_update_columns="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(column_name,',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='public' AND table_name='group_bot_grants' AND has_column_privilege('openbot_runtime',table_name,column_name,'UPDATE')")"
          test "$group_bot_update_columns" = 'close_event_id,close_sequence,closed_at,closure_reason'


          api_token_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_table_privilege('openbot_runtime', 'api_tokens', 'SELECT'), has_table_privilege('openbot_runtime', 'api_tokens', 'INSERT'), has_table_privilege('openbot_runtime', 'api_tokens', 'UPDATE'), has_table_privilege('openbot_runtime', 'api_tokens', 'DELETE'), has_table_privilege('openbot_runtime', 'api_tokens', 'TRUNCATE'))")"
          test "$api_token_table_privileges" = 't,t,f,f,f'
          api_token_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(column_name || ':' || has_column_privilege('openbot_runtime', 'api_tokens', column_name, 'UPDATE')::text, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'api_tokens'")"
          test "$api_token_update_privileges" = 'created_at:false,creator_user_id:false,expires_at:false,id:false,last_used_at:true,name:false,revoked_at:true,scopes:false,token_digest:false,workspace_id:false'

          column_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_column_privilege('openbot_runtime', 'instance_claims', 'owner_user_id', 'UPDATE'), has_column_privilege('openbot_runtime', 'instance_claims', 'singleton_key', 'UPDATE'), has_column_privilege('openbot_runtime', 'sessions', 'revoked_at', 'UPDATE'), has_column_privilege('openbot_runtime', 'sessions', 'token_digest', 'UPDATE'))")"
          test "$column_update_privileges" = 't,f,t,f'

          workspace_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_column_privilege('openbot_runtime', 'workspaces', 'name', 'UPDATE'), has_column_privilege('openbot_runtime', 'workspaces', 'description', 'UPDATE'), has_column_privilege('openbot_runtime', 'workspaces', 'id', 'UPDATE'))")"
          test "$workspace_update_privileges" = 't,t,f'

          invitation_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_table_privilege('openbot_runtime', 'workspace_invitations', 'SELECT'), has_table_privilege('openbot_runtime', 'workspace_invitations', 'INSERT'), has_table_privilege('openbot_runtime', 'workspace_invitations', 'UPDATE'), has_table_privilege('openbot_runtime', 'workspace_invitations', 'DELETE'), has_table_privilege('openbot_runtime', 'workspace_invitations', 'TRUNCATE'))")"
          test "$invitation_table_privileges" = 't,t,f,f,f'
          invitation_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(column_name || ':' || has_column_privilege('openbot_runtime', 'workspace_invitations', column_name, 'UPDATE')::text, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'workspace_invitations'")"
          test "$invitation_update_privileges" = 'consumed_at:true,consumed_by_user_id:true,created_at:false,created_by_user_id:false,email:false,expires_at:false,id:false,revoked_at:true,role:false,token_digest:false,workspace_id:false'

          audit_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_table_privilege('openbot_runtime', 'audit_events', 'SELECT'), has_table_privilege('openbot_runtime', 'audit_events', 'INSERT'), has_table_privilege('openbot_runtime', 'audit_events', 'UPDATE'), has_table_privilege('openbot_runtime', 'audit_events', 'DELETE'), has_table_privilege('openbot_runtime', 'audit_events', 'TRUNCATE'))")"
          test "$audit_privileges" = 'f,t,f,f,f'

          function_execute="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT has_function_privilege('openbot_runtime', 'reject_audit_event_mutation()', 'EXECUTE')")"
          test "$function_execute" = 'f'

          for mutation in update delete truncate; do
            case "$mutation" in
              update) statement="UPDATE audit_events SET metadata = '{}'::jsonb" ;;
              delete) statement='DELETE FROM audit_events' ;;
              truncate) statement='TRUNCATE TABLE audit_events' ;;
            esac
            if docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
              --host 127.0.0.1 --username openbot_runtime --dbname openbot \
              --set=ON_ERROR_STOP=1 --command "$statement" \
              >"/tmp/openbot-runtime-audit-$mutation.out" 2>&1; then
              echo "The API database role unexpectedly completed audit $mutation." >&2
              exit 1
            fi
            grep --extended-regexp --ignore-case --quiet \
              'permission denied|append-only' "/tmp/openbot-runtime-audit-$mutation.out"
          done

          if docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
            --host 127.0.0.1 \
            --username openbot_runtime --dbname openbot \
            --command 'DROP TRIGGER audit_events_append_only ON audit_events' \
            >/tmp/openbot-runtime-ddl.out 2>&1; then
            echo 'The API database role unexpectedly removed the audit guard.' >&2
            exit 1
          fi
          grep --extended-regexp --ignore-case --quiet \
            'must be owner|permission denied' /tmp/openbot-runtime-ddl.out
      - name: Verify the real local-owner session lifecycle
        run: |
          setup_code="$(curl --silent --show-error \
            --output /tmp/openbot-setup.json \
            --dump-header /tmp/openbot-setup.headers \
            --cookie-jar /tmp/openbot-cookies.txt \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --header 'X-OpenBot-Setup-Token: local-only-openbot-setup-token-change-me' \
            --data '{"displayName":"CI Owner","email":"owner@example.com","password":"ci-only-owner-password"}' \
            http://localhost:3001/api/v1/setup)"
          test "$setup_code" = '201'
          test "$(jq --raw-output '.user.email' /tmp/openbot-setup.json)" = 'owner@example.com'
          grep --ignore-case --quiet '^set-cookie: openbot_session=' /tmp/openbot-setup.headers
          grep --ignore-case --quiet 'httponly' /tmp/openbot-setup.headers
          grep --ignore-case --quiet 'samesite=lax' /tmp/openbot-setup.headers

          repeat_code="$(curl --silent --show-error \
            --output /tmp/openbot-repeat-setup.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --header 'X-OpenBot-Setup-Token: local-only-openbot-setup-token-change-me' \
            --data '{"displayName":"Second Owner","email":"second@example.com","password":"another-owner-password"}' \
            http://localhost:3001/api/v1/setup)"
          test "$repeat_code" = '409'
          test "$(jq --raw-output '.error.code' /tmp/openbot-repeat-setup.json)" = 'instance_already_claimed'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/openbot-cookies.txt http://localhost:3001/api/v1/me)" = '200'

          cross_site_code="$(curl --silent --show-error \
            --output /tmp/openbot-cross-site.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --cookie /tmp/openbot-cookies.txt \
            --header 'Origin: https://attacker.example' \
            http://localhost:3001/api/v1/session)"
          test "$cross_site_code" = '403'
          test "$(jq --raw-output '.error.code' /tmp/openbot-cross-site.json)" = 'invalid_origin'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/openbot-cookies.txt http://localhost:3001/api/v1/me)" = '200'

          sign_out_code="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header /tmp/openbot-sign-out.headers \
            --write-out '%{http_code}' \
            --request DELETE \
            --cookie /tmp/openbot-cookies.txt \
            --header 'Origin: http://localhost:3000' \
            http://localhost:3001/api/v1/session)"
          test "$sign_out_code" = '204'
          grep --ignore-case --quiet 'max-age=0' /tmp/openbot-sign-out.headers
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/openbot-cookies.txt http://localhost:3001/api/v1/me)" = '401'

          audit_types="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(event_type, ',' ORDER BY event_type) FROM audit_events")"
          test "$audit_types" = 'auth.signed_in,auth.signed_out,instance.claimed'
          unsafe_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM audit_events WHERE metadata::text ~* '(password|cookie|token|secret)'")"
          test "$unsafe_audits" = '0'
      - name: Verify workspace creation and settings with the restricted runtime role
        run: |
          curl --fail --silent --cookie-jar /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"email":"owner@example.com","password":"ci-only-owner-password"}' \
            http://localhost:3001/api/v1/session >/dev/null
          curl --fail --silent --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"name":"CI Workspace","description":"CI private description"}' \
            http://localhost:3001/api/v1/workspaces > /tmp/openbot-workspace.json
          workspace_id="$(jq --raw-output '.workspace.id' /tmp/openbot-workspace.json)"
          test "$(jq --raw-output '.workspace.role' /tmp/openbot-workspace.json)" = 'owner'
          curl --fail --silent --request PATCH --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"name":"Updated Workspace","description":"Updated private description"}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id" > /tmp/openbot-workspace-updated.json
          test "$(jq --raw-output '.workspace.name' /tmp/openbot-workspace-updated.json)" = 'Updated Workspace'
          workspace_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(event_type, ',' ORDER BY event_type) FROM audit_events WHERE event_type LIKE 'workspace.%'")"
          test "$workspace_audits" = 'workspace.created,workspace.settings_changed'
          unsafe_workspace_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM audit_events WHERE event_type LIKE 'workspace.%' AND metadata::text ~ '(CI Workspace|private description|Updated Workspace)'")"
          test "$unsafe_workspace_audits" = '0'
      - name: Verify one-time invitations with the restricted runtime role
        run: |
          workspace_id="$(jq --raw-output '.workspace.id' /tmp/openbot-workspace.json)"
          invitation_code="$(curl --silent --show-error \
            --output /tmp/openbot-invitation.json --write-out '%{http_code}' \
            --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"email":"invitee@example.com","role":"member","expiresInDays":1}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/invitations")"
          test "$invitation_code" = '201'
          jq --exit-status '.token | test("^[A-Za-z0-9_-]{43}$")' /tmp/openbot-invitation.json >/dev/null
          invitation_id="$(jq --raw-output '.invitation.id' /tmp/openbot-invitation.json)"
          invitation_token="$(jq --raw-output '.token' /tmp/openbot-invitation.json)"
          invitation_digest="$(printf '%s' "$invitation_token" | sha256sum | cut --delimiter=' ' --fields=1)"
          stored_digest="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT token_digest FROM workspace_invitations WHERE id = '$invitation_id'")"
          test "$stored_digest" = "$invitation_digest"
          test "$stored_digest" != "$invitation_token"

          jq --null-input --arg token "$invitation_token" \
            '{token:$token,email:"invitee@example.com",displayName:"CI Invitee",password:"ci-only-invitee-password"}' \
            > /tmp/openbot-invitation-accept.json
          accept_code="$(curl --silent --show-error \
            --output /tmp/openbot-invitation-accepted.json --write-out '%{http_code}' \
            --dump-header /tmp/openbot-invitation-accepted.headers \
            --cookie-jar /tmp/openbot-invitee-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/openbot-invitation-accept.json \
            http://localhost:3001/api/v1/invitations/accept)"
          test "$accept_code" = '201'
          test "$(jq --raw-output '.user.email' /tmp/openbot-invitation-accepted.json)" = 'invitee@example.com'
          test "$(jq --raw-output '.workspace.id' /tmp/openbot-invitation-accepted.json)" = "$workspace_id"
          grep --ignore-case --quiet 'httponly' /tmp/openbot-invitation-accepted.headers
          grep --ignore-case --quiet 'samesite=lax' /tmp/openbot-invitation-accepted.headers
          curl --fail --silent --show-error --cookie /tmp/openbot-invitee-cookies.txt \
            http://localhost:3001/api/v1/workspaces > /tmp/openbot-invitee-workspaces.json
          jq --exit-status --arg id "$workspace_id" \
            'any(.workspaces[]; .id == $id and .role == "member")' /tmp/openbot-invitee-workspaces.json >/dev/null
          test "$(curl --silent --show-error --output /tmp/openbot-invitation-member.json \
            --write-out '%{http_code}' --cookie /tmp/openbot-invitee-cookies.txt \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/invitations")" = '403'

          replay_code="$(curl --silent --show-error \
            --output /tmp/openbot-invitation-replay.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/openbot-invitation-accept.json \
            http://localhost:3001/api/v1/invitations/accept)"
          test "$replay_code" = '409'
          test "$(jq --raw-output '.error.code' /tmp/openbot-invitation-replay.json)" = 'invitation_unavailable'

          revoke_create_code="$(curl --silent --show-error \
            --output /tmp/openbot-invitation-to-revoke.json --write-out '%{http_code}' \
            --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"email":"revoked@example.com","role":"administrator","expiresInDays":1}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/invitations")"
          test "$revoke_create_code" = '201'
          revoked_id="$(jq --raw-output '.invitation.id' /tmp/openbot-invitation-to-revoke.json)"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Origin: http://localhost:3000' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/invitations/$revoked_id")" = '204'
          jq '{token:.token,email:"revoked@example.com",displayName:"Revoked",password:"ci-only-revoked-password"}' \
            /tmp/openbot-invitation-to-revoke.json > /tmp/openbot-revoked-accept.json
          revoked_code="$(curl --silent --show-error \
            --output /tmp/openbot-invitation-revoked.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data-binary @/tmp/openbot-revoked-accept.json \
            http://localhost:3001/api/v1/invitations/accept)"
          test "$revoked_code" = '409'
          test "$(jq --raw-output '.error.code' /tmp/openbot-invitation-revoked.json)" = 'invitation_unavailable'
          curl --fail --silent --show-error --cookie /tmp/openbot-workspace-cookies.txt \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/invitations" > /tmp/openbot-invitations.json
          jq --exit-status '(.invitations | length) == 2 and all(.invitations[]; (has("token") | not) and (has("tokenDigest") | not) and (has("token_digest") | not))' \
            /tmp/openbot-invitations.json >/dev/null

          invitation_state="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', COUNT(*), COUNT(*) FILTER (WHERE consumed_at IS NOT NULL AND consumed_by_user_id IS NOT NULL), COUNT(*) FILTER (WHERE revoked_at IS NOT NULL AND consumed_at IS NULL)) FROM workspace_invitations WHERE workspace_id = '$workspace_id'")"
          test "$invitation_state" = '2,1,1'
          revoked_accounts="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM users WHERE normalized_email = 'revoked@example.com'")"
          test "$revoked_accounts" = '0'
          invitation_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(event_type, ',' ORDER BY event_type) FROM audit_events WHERE event_type LIKE 'invitation.%'")"
          test "$invitation_audits" = 'invitation.accepted,invitation.created,invitation.created,invitation.revoked'
          unsafe_invitation_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM audit_events WHERE event_type LIKE 'invitation.%' AND metadata::text ~* '(password|cookie|token|secret|invitee@example.com|revoked@example.com)'")"
          test "$unsafe_invitation_audits" = '0'
      - name: Verify member roles and access removal with the restricted runtime role
        run: |
          curl --fail --silent --show-error --cookie /tmp/openbot-workspace-cookies.txt \
            http://localhost:3001/api/v1/me > /tmp/openbot-owner-me.json
          curl --fail --silent --show-error --cookie /tmp/openbot-invitee-cookies.txt \
            http://localhost:3001/api/v1/me > /tmp/openbot-member-me.json
          owner_id="$(jq --raw-output '.user.id' /tmp/openbot-owner-me.json)"
          member_id="$(jq --raw-output '.user.id' /tmp/openbot-member-me.json)"
          workspace_id="$(jq --raw-output '.workspace.id' /tmp/openbot-member-me.json)"
          invitation_id="$(jq --raw-output '.invitation.id' /tmp/openbot-invitation.json)"
          curl --fail --silent --show-error --cookie /tmp/openbot-workspace-cookies.txt \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members" > /tmp/openbot-members.json
          jq --exit-status --arg user "$member_id" --arg inviter "$owner_id" --arg invitation "$invitation_id" \
            'any(.members[]; .user.id == $user and .role == "member" and .invitation.id == $invitation and .invitation.invitedBy.id == $inviter)' \
            /tmp/openbot-members.json >/dev/null

          promote_code="$(curl --silent --show-error \
            --output /tmp/openbot-member-promoted.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"role":"administrator"}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$member_id")"
          test "$promote_code" = '200'
          test "$(jq --raw-output '.member.role' /tmp/openbot-member-promoted.json)" = 'administrator'
          escalation_code="$(curl --silent --show-error \
            --output /tmp/openbot-member-escalation.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/openbot-invitee-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"role":"owner"}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$member_id")"
          test "$escalation_code" = '403'
          owner_attack_code="$(curl --silent --show-error \
            --output /tmp/openbot-member-owner-attack.json --write-out '%{http_code}' \
            --request DELETE --cookie /tmp/openbot-invitee-cookies.txt \
            --header 'Origin: http://localhost:3000' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$owner_id")"
          test "$owner_attack_code" = '403'

          last_owner_demote_code="$(curl --silent --show-error \
            --output /tmp/openbot-last-owner-demote.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"role":"member"}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$owner_id")"
          test "$last_owner_demote_code" = '409'
          test "$(jq --raw-output '.error.code' /tmp/openbot-last-owner-demote.json)" = 'last_owner_required'
          last_owner_remove_code="$(curl --silent --show-error \
            --output /tmp/openbot-last-owner-remove.json --write-out '%{http_code}' \
            --request DELETE --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Origin: http://localhost:3000' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$owner_id")"
          test "$last_owner_remove_code" = '409'
          test "$(jq --raw-output '.error.code' /tmp/openbot-last-owner-remove.json)" = 'last_owner_required'

          demote_code="$(curl --silent --show-error \
            --output /tmp/openbot-member-demoted.json --write-out '%{http_code}' \
            --request PATCH --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Content-Type: application/json' --header 'Origin: http://localhost:3000' \
            --data '{"role":"member"}' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$member_id")"
          test "$demote_code" = '200'
          test "$(jq --raw-output '.member.role' /tmp/openbot-member-demoted.json)" = 'member'
          remove_code="$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request DELETE --cookie /tmp/openbot-workspace-cookies.txt \
            --header 'Origin: http://localhost:3000' \
            "http://localhost:3001/api/v1/workspaces/$workspace_id/members/$member_id")"
          test "$remove_code" = '204'
          retained_session_code="$(curl --silent --show-error \
            --output /tmp/openbot-removed-member-me.json --write-out '%{http_code}' \
            --cookie /tmp/openbot-invitee-cookies.txt http://localhost:3001/api/v1/me)"
          test "$retained_session_code" = '200'
          jq --exit-status --arg user "$member_id" '.user.id == $user and .workspace == null' \
            /tmp/openbot-removed-member-me.json >/dev/null
          for suffix in '' /members /invitations; do
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --cookie /tmp/openbot-invitee-cookies.txt \
              "http://localhost:3001/api/v1/workspaces/$workspace_id$suffix")" = '403'
          done

          retained_member_state="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', (SELECT COUNT(*) FROM workspace_memberships WHERE user_id = '$member_id'), (SELECT COUNT(*) FROM users WHERE id = '$member_id'), (SELECT COUNT(*) FROM local_credentials WHERE user_id = '$member_id'), (SELECT COUNT(*) FROM sessions WHERE user_id = '$member_id' AND revoked_at IS NULL AND expires_at > NOW()), (SELECT COUNT(*) FROM workspace_invitations WHERE id = '$invitation_id' AND consumed_by_user_id = '$member_id' AND consumed_at IS NOT NULL), (SELECT COUNT(*) FROM audit_events WHERE event_type = 'invitation.accepted' AND actor_user_id = '$member_id'))")"
          test "$retained_member_state" = '0,1,1,1,1,1'
          member_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(event_type, ',' ORDER BY event_type) FROM audit_events WHERE event_type IN ('workspace.member_removed', 'workspace.member_role_changed')")"
          test "$member_audits" = 'workspace.member_removed,workspace.member_role_changed,workspace.member_role_changed'
          unsafe_member_audits="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM audit_events WHERE event_type IN ('workspace.member_removed', 'workspace.member_role_changed') AND metadata::text ~* '(password|cookie|token|secret|invitee@example.com)'")"
          test "$unsafe_member_audits" = '0'
      - name: Verify groups and human membership with the restricted runtime role
        run: |
          set -Eeuo pipefail
          group_stage=initialize
          trap 'code=$?; printf "Group smoke failed at stage %s (line %s, exit %s)\n" "$group_stage" "$LINENO" "$code" >&2; exit "$code"' ERR
          workspace_id="$(jq --raw-output '.workspace.id' /tmp/openbot-workspace.json)"
          owner_cookies=/tmp/openbot-workspace-cookies.txt
          response=/tmp/openbot-group-response.json
          group_request() {
            local method="$1" cookies="$2" path="$3" expected="$4" code
            local -a args=(--silent --show-error --request "$method"
              --cookie "$cookies" --cookie-jar "$cookies"
              --header 'Origin: http://localhost:3000'
              --output "$response" --write-out '%{http_code}')
            if [ "$#" -eq 5 ]; then
              args+=(--header 'Content-Type: application/json' --data "$5")
            fi
            code="$(curl "${args[@]}" "http://localhost:3001$path")"
            if [ "$code" != "$expected" ]; then
              echo "$method $path returned $code; expected $expected" >&2
              exit 1
            fi
          }
          group_sql() {
            docker compose exec -T postgres psql \
              --username openbot --dbname openbot --tuples-only --no-align \
              --set=ON_ERROR_STOP=1 --command "$1"
          }
          declare -A group_users group_cookies
          for person in b c d; do
            group_stage="invite-member-$person"
            email="group-$person@example.com"
            group_cookies[$person]="/tmp/openbot-group-$person-cookies.txt"
            touch "${group_cookies[$person]}"
            group_request POST "$owner_cookies" "/api/v1/workspaces/$workspace_id/invitations" 201 \
              "$(jq --null-input --arg email "$email" '{email:$email,role:"member",expiresInDays:1}')"
            token="$(jq --raw-output '.token' "$response")"
            group_request POST "${group_cookies[$person]}" /api/v1/invitations/accept 201 \
              "$(jq --null-input --arg token "$token" --arg email "$email" \
                '{token:$token,email:$email,displayName:"CI Group Member",password:"ci-only-group-password"}')"
            group_users[$person]="$(jq --raw-output '.user.id' "$response")"
            jq --exit-status --arg workspace "$workspace_id" \
              '.workspace.id == $workspace' "$response" >/dev/null
            group_request GET "$owner_cookies" "/api/v1/workspaces/$workspace_id/members" 200
            jq --exit-status --arg user "${group_users[$person]}" \
              'any(.members[]; .user.id == $user and .role == "member")' "$response" >/dev/null
          done
          b="${group_users[b]}" c="${group_users[c]}" d="${group_users[d]}"
          b_cookies="${group_cookies[b]}" c_cookies="${group_cookies[c]}" d_cookies="${group_cookies[d]}"
          base="/api/v1/workspaces/$workspace_id/groups"
          group_stage=private-creation
          group_request POST "$b_cookies" "$base" 201 '{"name":"Compose group"}'
          jq --exit-status '.group.visibility == "private" and .group.description == "" and .group.role == "owner"' "$response" >/dev/null
          group_id="$(jq --raw-output '.group.id' "$response")"
          group_path="$base/$group_id"
          for suffix in '' /members; do
            group_request GET "$owner_cookies" "$group_path$suffix" 403
            test "$(jq --raw-output '.error.code' "$response")" = 'group_forbidden'
          done
          group_stage=discoverable-metadata
          group_request PATCH "$b_cookies" "$group_path" 200 \
            '{"description":"Runtime membership smoke","visibility":"workspace"}'
          jq --exit-status '.group.name == "Compose group" and .group.visibility == "workspace" and .group.description == "Runtime membership smoke"' "$response" >/dev/null
          group_request GET "$owner_cookies" "$group_path" 200
          jq --exit-status '.group.role == null' "$response" >/dev/null
          group_request GET "$owner_cookies" "$base" 200
          jq --exit-status --arg group "$group_id" 'any(.groups[]; .id == $group and .role == null)' "$response" >/dev/null
          group_request GET "$owner_cookies" "$group_path/members" 403

          group_stage=human-membership-authority
          group_request POST "$b_cookies" "$group_path/members" 201 \
            "$(jq --null-input --arg user "$c" '{userId:$user,role:"admin"}')"
          group_request POST "$c_cookies" "$group_path/members" 201 \
            "$(jq --null-input --arg user "$d" '{userId:$user,role:"member"}')"
          group_request PATCH "$d_cookies" "$group_path" 403 '{"name":"Forbidden"}'
          group_request POST "$d_cookies" "$group_path/members" 403 \
            "$(jq --null-input --arg user "$b" '{userId:$user,role:"member"}')"
          group_request PATCH "$c_cookies" "$group_path/members/$d" 403 '{"role":"owner"}'
          group_request PATCH "$c_cookies" "$group_path/members/$b" 403 '{"role":"member"}'
          group_request DELETE "$c_cookies" "$group_path/members/$d" 204
          group_request GET "$d_cookies" "$group_path/members" 403
          group_request GET "$d_cookies" "$group_path" 200
          jq --exit-status '.group.role == null' "$response" >/dev/null
          group_request POST "$c_cookies" "$group_path/members" 201 \
            "$(jq --null-input --arg user "$d" '{userId:$user,role:"member"}')"
          group_request POST "$c_cookies" "$group_path/members" 409 \
            "$(jq --null-input --arg user "$d" '{userId:$user,role:"member"}')"
          test "$(jq --raw-output '.error.code' "$response")" = 'group_member_conflict'
          group_request GET "$d_cookies" "$group_path" 200
          test "$(jq --raw-output '.group.role' "$response")" = 'member'

          group_stage=workspace-removal-and-eligible-owner
          group_request PATCH "$b_cookies" "$group_path/members/$c" 200 '{"role":"owner"}'
          group_request DELETE "$owner_cookies" "/api/v1/workspaces/$workspace_id/members/$b" 204
          group_request GET "$b_cookies" /api/v1/me 200
          jq --exit-status --arg user "$b" '.user.id == $user and .workspace == null' "$response" >/dev/null
          for path in "$base" "$group_path" "$group_path/members"; do
            group_request GET "$b_cookies" "$path" 403
          done
          retained_grant="$(group_sql "SELECT concat_ws(',', (SELECT COUNT(*) FROM workspace_memberships WHERE workspace_id = '$workspace_id' AND user_id = '$b'), (SELECT COUNT(*) FROM group_memberships WHERE group_id = '$group_id' AND user_id = '$b' AND role = 'owner'), (SELECT COUNT(*) FROM groups WHERE id = '$group_id' AND created_by_user_id = '$b'))")"
          test "$retained_grant" = '0,1,1'
          group_request PATCH "$c_cookies" "$group_path/members/$c" 409 '{"role":"member"}'
          test "$(jq --raw-output '.error.code' "$response")" = 'last_group_owner_required'
          group_request DELETE "$c_cookies" "$group_path/members/$c" 409
          test "$(jq --raw-output '.error.code' "$response")" = 'last_group_owner_required'

          group_stage=workspace-rejoin-and-group-removal
          group_request POST "$owner_cookies" "/api/v1/workspaces/$workspace_id/invitations" 201 \
            '{"email":"group-b@example.com","role":"member","expiresInDays":1}'
          token="$(jq --raw-output '.token' "$response")"
          group_request POST "$b_cookies" /api/v1/invitations/accept 200 \
            "$(jq --null-input --arg token "$token" '{token:$token}')"
          jq --exit-status --arg user "$b" --arg workspace "$workspace_id" \
            '.user.id == $user and .workspace.id == $workspace' "$response" >/dev/null
          group_request GET "$b_cookies" "$group_path" 200
          test "$(jq --raw-output '.group.role' "$response")" = 'owner'
          group_request GET "$b_cookies" "$group_path/members" 200
          group_request DELETE "$c_cookies" "$group_path/members/$b" 204
          group_request PATCH "$c_cookies" "$group_path" 200 '{"visibility":"private"}'
          for suffix in '' /members; do
            group_request GET "$b_cookies" "$group_path$suffix" 403
          done
          group_request GET "$owner_cookies" "$group_path" 403
          group_stage=retained-authorship-and-audits
          retained_author="$(group_sql "SELECT concat_ws(',', (SELECT COUNT(*) FROM users WHERE id = '$b'), (SELECT COUNT(*) FROM local_credentials WHERE user_id = '$b'), (SELECT COUNT(*) FROM sessions WHERE user_id = '$b' AND revoked_at IS NULL AND expires_at > NOW()), (SELECT COUNT(*) FROM groups WHERE id = '$group_id' AND created_by_user_id = '$b'), (SELECT COUNT(*) FROM group_memberships WHERE group_id = '$group_id' AND user_id = '$b'), (SELECT COUNT(*) FROM workspace_memberships WHERE workspace_id = '$workspace_id' AND user_id = '$b'), (SELECT COUNT(*) FROM audit_events WHERE event_type = 'group.created' AND actor_user_id = '$b' AND metadata->>'groupId' = '$group_id'))")"
          test "$retained_author" = '1,1,1,1,0,1,1'
          group_audits="$(group_sql "SELECT string_agg(event_type, ',' ORDER BY event_type) FROM audit_events WHERE metadata->>'groupId' = '$group_id'")"
          test "$group_audits" = 'group.created,group.member_added,group.member_added,group.member_added,group.member_removed,group.member_removed,group.member_role_changed,group.metadata_changed,group.metadata_changed'
          unsafe_group_audits="$(group_sql "SELECT COUNT(*) FROM audit_events WHERE metadata->>'groupId' = '$group_id' AND (metadata::text ~* '(credential|cookie|password|email|token|secret|@)' OR metadata->>'workspaceId' IS DISTINCT FROM '$workspace_id' OR EXISTS (SELECT 1 FROM jsonb_each_text(metadata) AS field(key, value) WHERE key IN ('groupId', 'workspaceId', 'targetUserId') AND value !~ '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))")"
          test "$unsafe_group_audits" = '0'
          audit_count="$(group_sql "SELECT COUNT(*) FROM audit_events WHERE metadata->>'groupId' = '$group_id'")"
          test "$audit_count" = '9'
          group_stage=no-op-audits
          group_request PATCH "$c_cookies" "$group_path" 200 '{"visibility":"private"}'
          group_request PATCH "$c_cookies" "$group_path/members/$c" 200 '{"role":"owner"}'
          test "$(group_sql "SELECT COUNT(*) FROM audit_events WHERE metadata->>'groupId' = '$group_id'")" = "$audit_count"
      - name: Verify scoped API tokens with the restricted runtime role
        run: docker compose exec -T api node --input-type=module < infra/verify-api-tokens.mjs
      - name: Verify the real unavailable state after database outage
        run: |
          docker compose stop postgres

          for attempt in {1..20}; do
            http_code="$(curl --silent --output /tmp/openbot-api-status.json --write-out '%{http_code}' http://localhost:3001/api/v1/status || true)"
            if [ "$http_code" = '503' ]; then
              break
            fi
            sleep 1
          done
          test "$http_code" = '503'
          test "$(jq --compact-output --sort-keys . /tmp/openbot-api-status.json)" = '{"checks":{"database":"unavailable","migrations":"unknown"},"schemaVersion":1,"status":"unavailable"}'

          for attempt in {1..20}; do
            page="$(curl --fail --silent http://localhost:3000 || true)"
            if grep --fixed-strings --quiet 'data-state="unavailable"' <<<"$page"; then
              break
            fi
            sleep 1
          done
          grep --fixed-strings --quiet 'data-state="unavailable"' <<<"$page"
          grep --fixed-strings --quiet '>Unavailable<' <<<"$page"
      - if: always()
        run: |
          docker compose logs
          docker compose down --volumes
