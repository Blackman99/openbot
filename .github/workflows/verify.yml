name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  postgres-auth:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_auth_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_auth_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_auth_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api run test:postgres

  postgres-providers:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_providers_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_providers_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PROVIDER_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_providers_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api run test:postgres

  postgres-oidc:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_oidc_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_oidc_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_OIDC_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_oidc_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api run test:postgres

  postgres-bots:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_bots_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_bots_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_BOT_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_bots_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/bots-runtime.test.ts
      # Each suite closes its pools before the next one reprovisions the fixed role.
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/bot-acl-runtime.test.ts
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/bot-avatars-runtime.test.ts
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/bot-versions-runtime.test.ts

  object-storage:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_BUCKET: openbot-avatars-ci
      TEST_S3_REGION: us-east-1
      TEST_S3_ACCESS_KEY_ID: openbot-ci
      TEST_S3_SECRET_ACCESS_KEY: ci-only-object-password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the isolated S3-compatible test service
        run: |
          # Fixed upstream image, used only as this disposable loopback CI fixture.
          docker run --detach --name openbot-s3-ci \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --console-address :9001
          ready=false
          for attempt in $(seq 1 30); do
            # This probe checks write quorum; /ready alone only checks liveness.
            if curl --fail --silent --output /dev/null --connect-timeout 2 --max-time 3 \
              "$TEST_S3_ENDPOINT/minio/health/cluster"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'S3 test service did not become ready.' >&2
            exit 1
          fi
      - name: Create the private test bucket
        run: |
          pnpm --filter @openbot/api exec node --input-type=module <<'NODE'
          import { CreateBucketCommand, HeadBucketCommand, S3Client } from '@aws-sdk/client-s3';
          const client = new S3Client({
            endpoint: process.env.TEST_S3_ENDPOINT,
            region: process.env.TEST_S3_REGION,
            forcePathStyle: true,
            maxAttempts: 1,
            credentials: {
              accessKeyId: process.env.TEST_S3_ACCESS_KEY_ID,
              secretAccessKey: process.env.TEST_S3_SECRET_ACCESS_KEY,
            },
          });
          const options = { abortSignal: AbortSignal.timeout(10000) };
          const input = { Bucket: process.env.TEST_S3_BUCKET };
          try {
            await client.send(new CreateBucketCommand(input), options);
            await client.send(new HeadBucketCommand(input), options);
          } catch {
            throw new Error('Unable to initialize the private S3 test bucket.');
          } finally {
            client.destroy();
          }
          NODE
      - name: Verify local and real S3 object-storage contracts
        run: pnpm --filter @openbot/api exec vitest run tests/integration/local-object-store.test.ts tests/s3/object-store.test.ts --maxWorkers=1
      - name: Collect S3 fixture failure logs
        if: failure()
        run: docker logs openbot-s3-ci
      - name: Remove the disposable S3 fixture
        if: always()
        run: docker rm --force --volumes openbot-s3-ci

  postgres-conversations:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_conversations_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_conversations_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_CONVERSATION_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_conversations_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/conversations-runtime.test.ts

  postgres-group-bots:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: openbot_group_bots_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=ci-only-password PGCONNECT_TIMEOUT=2 PGOPTIONS='-c statement_timeout=2000' psql --host postgres --username openbot --dbname openbot_group_bots_test --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_GROUP_BOT_DATABASE_URL: postgresql://openbot:ci-only-password@127.0.0.1:5432/openbot_group_bots_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openbot/api exec vitest run tests/postgres/group-bots-runtime.test.ts

  compose:
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Verify a fresh database volume before the upgrade path
        run: |
          docker compose up --build --detach

          migration_id="$(docker compose ps --all --quiet migrate)"
          api_id="$(docker compose ps --all --quiet api)"
          test -n "$migration_id"
          test -n "$api_id"
          test "$(docker inspect --format '{{.State.Status}}' "$migration_id")" = 'exited'
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")" = '0'

          migration_finished_at="$(docker inspect --format '{{.State.FinishedAt}}' "$migration_id")"
          api_started_at="$(docker inspect --format '{{.State.StartedAt}}' "$api_id")"
          if [[ "$api_started_at" < "$migration_finished_at" ]]; then
            echo 'The API started before the migration and privilege gate completed.' >&2
            exit 1
          fi

          stack_ready='false'
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/api/v1/status >/dev/null \
              && curl --fail --silent http://localhost:3000 >/dev/null; then
              stack_ready='true'
              break
            fi
            sleep 1
          done
          test "$stack_ready" = 'true'

          migration_versions="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(version, ',' ORDER BY applied_at, version) FROM openbot_schema_migrations")"
          test "$migration_versions" = '0001_bootstrap,0002_local_owner_auth,0003_workspace_settings,0004_personal_model_connections,0005_workspace_invitations,0006_workspace_member_provenance,0007_oidc,0008_workspace_model_connections,0009_groups_and_human_memberships,0010_scoped_api_tokens,0011_model_capability_policies,0012_bot_identity,0013_bot_avatar_objects,0014_conversation_ledger,0015_group_bot_grants'

          # Exercise the production Alpine Sharp binary and private mounted volume as the API user.
          docker compose exec -T api node --input-type=module <<'JS'
          import sharp from 'sharp';
          import { stat } from 'node:fs/promises';
          import { randomUUID } from 'node:crypto';
          import { LocalObjectStore } from './dist/objects/local-store.js';
          const store = new LocalObjectStore('/var/lib/openbot/objects');
          const key = { workspaceId: randomUUID(), objectId: randomUUID() };
          const bytes = await sharp({create:{width:1,height:1,channels:3,background:'red'}}).png().toBuffer();
          await store.save(key, bytes);
          if (!(await store.read(key, 2097152)).equals(bytes)) throw new Error('avatar volume roundtrip failed');
          const info = await stat('/var/lib/openbot/objects');
          if ((info.mode & 0o777) !== 0o700 || info.uid !== process.getuid()) throw new Error('avatar volume privacy failed');
          await store.delete(key);
          JS

          docker compose down --volumes
      - name: Seed an existing pre-authentication database volume
        run: |
          docker compose up --detach postgres

          database_ready='false'
          for attempt in {1..30}; do
            if docker compose exec -T postgres /bin/sh -ec '
              PGPASSWORD="$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=2 PGOPTIONS="-c statement_timeout=2000" \
                psql --host postgres --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
                --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --command "SELECT 1" >/dev/null
            '; then
              database_ready='true'
              break
            fi
            sleep 1
          done
          test "$database_ready" = 'true'

          docker compose exec -T postgres psql \
            --username openbot --dbname openbot --set=ON_ERROR_STOP=1 \
            --command "CREATE TABLE IF NOT EXISTS openbot_schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()); INSERT INTO openbot_schema_migrations (version) VALUES ('0001_bootstrap') ON CONFLICT (version) DO NOTHING; DROP ROLE IF EXISTS openbot_runtime; DROP ROLE IF EXISTS openbot_runtime_elevated; DROP ROLE IF EXISTS openbot_limited_migrator; CREATE ROLE openbot_runtime_elevated WITH NOLOGIN CREATEDB CREATEROLE BYPASSRLS; CREATE ROLE openbot_runtime WITH LOGIN PASSWORD 'replace-runtime-me'; ALTER ROLE openbot_runtime WITH SUPERUSER CREATEDB CREATEROLE INHERIT REPLICATION BYPASSRLS CONNECTION LIMIT 1 VALID UNTIL '2000-01-01'; ALTER ROLE openbot_runtime SET search_path TO attacker, public; ALTER ROLE openbot_runtime IN DATABASE openbot SET statement_timeout TO '1ms'; CREATE ROLE openbot_limited_migrator WITH LOGIN PASSWORD 'ci-limited-migrator-password' CREATEROLE; GRANT openbot_runtime_elevated TO openbot_runtime; GRANT ALL PRIVILEGES ON DATABASE openbot TO openbot_runtime; GRANT ALL ON SCHEMA public TO openbot_runtime;"
      - name: Verify a failed role downgrade does not disclose its password
        run: |
          if failure_output="$(docker compose run --rm --no-deps \
            -e PGUSER=openbot_limited_migrator \
            -e PGPASSWORD=ci-limited-migrator-password \
            -e OPENBOT_DATABASE_PASSWORD=ci-secret-must-not-appear-in-logs \
            migrate node /app/grant-runtime-privileges.mjs 2>&1)"; then
            echo 'A non-superuser unexpectedly downgraded the superuser runtime role.' >&2
            exit 1
          fi
          grep --fixed-strings --quiet \
            'Runtime database privilege provisioning failed' <<<"$failure_output"
          if grep --fixed-strings --quiet \
            'ci-secret-must-not-appear-in-logs' <<<"$failure_output"; then
            echo 'The failed migration disclosed the runtime database password.' >&2
            exit 1
          fi
          if docker compose logs postgres | grep --fixed-strings --quiet \
            'ci-secret-must-not-appear-in-logs'; then
            echo 'PostgreSQL logs disclosed the runtime database password.' >&2
            exit 1
          fi
      - name: Start the stack and require a successful migration
        run: |
          docker compose up --build --detach

          migration_id="$(docker compose ps --all --quiet migrate)"
          test -n "$migration_id"
          migration_state=''
          for attempt in {1..60}; do
            migration_state="$(docker inspect --format '{{.State.Status}}' "$migration_id")"
            if [ "$migration_state" = 'exited' ] || [ "$migration_state" = 'dead' ]; then
              break
            fi
            sleep 1
          done
          test "$migration_state" = 'exited'
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")" = '0'

          stack_ready='false'
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/api/v1/status >/dev/null \
              && curl --fail --silent http://localhost:3000 >/dev/null; then
              stack_ready='true'
              break
            fi
            sleep 1
          done
          test "$stack_ready" = 'true'
      - name: Verify an existing API role can rotate its password
        run: |
          # Use the service address: initdb trusts loopback connections inside
          # the database container, which would bypass password verification.
          OPENBOT_DATABASE_PASSWORD=ci-rotated-runtime-password \
            docker compose run --rm migrate

          docker compose exec -T -e PGPASSWORD=ci-rotated-runtime-password postgres psql \
            --host postgres --username openbot_runtime --dbname openbot \
            --command 'SELECT 1' >/dev/null
          if old_password_output="$(docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
            --host postgres --username openbot_runtime --dbname openbot \
            --command 'SELECT 1' 2>&1)"; then
            echo 'The previous API database password still authenticates.' >&2
            exit 1
          fi
          grep --fixed-strings --quiet 'password authentication failed' <<<"$old_password_output"

          docker compose run --rm migrate
          docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
            --host postgres --username openbot_runtime --dbname openbot \
            --command 'SELECT 1' >/dev/null
      - name: Verify the real ready state
        run: |
          api_status="$(curl --fail --silent http://localhost:3001/api/v1/status)"
          test "$(printf '%s' "$api_status" | jq --compact-output --sort-keys .)" = '{"checks":{"database":"ready","migrations":"current"},"schemaVersion":1,"status":"ready"}'

          page="$(curl --fail --silent http://localhost:3000)"
          grep --fixed-strings --quiet 'data-state="ready"' <<<"$page"
          grep --fixed-strings --quiet '>Ready<' <<<"$page"
      - name: Verify the API database role has only minimum runtime privileges
        run: |
          role_flags="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolreplication, rolbypassrls) FROM pg_roles WHERE rolname = 'openbot_runtime'")"
          test "$role_flags" = 'f,f,f,f,f,f'

          role_login_policy="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', rolconnlimit, rolvaliduntil::text, rolconfig IS NULL) FROM pg_roles WHERE rolname = 'openbot_runtime'")"
          test "$role_login_policy" = '-1,infinity,t'

          role_settings="$(docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
            --host 127.0.0.1 --username openbot_runtime --dbname openbot \
            --tuples-only --no-align \
            --command "SELECT current_setting('search_path') || ';' || current_setting('statement_timeout')")"
          test "$role_settings" = 'pg_catalog, public;0'

          membership_count="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM pg_auth_members AS membership JOIN pg_roles AS member_role ON member_role.oid = membership.member WHERE member_role.rolname = 'openbot_runtime'")"
          test "$membership_count" = '0'

          database_owner_membership="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT pg_has_role('openbot_runtime', 'pg_database_owner', 'MEMBER')")"
          test "$database_owner_membership" = 'f'

          runtime_owned_objects="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT (SELECT COUNT(*) FROM pg_database WHERE datdba = role.oid) + (SELECT COUNT(*) FROM pg_namespace WHERE nspowner = role.oid) + (SELECT COUNT(*) FROM pg_class WHERE relowner = role.oid) + (SELECT COUNT(*) FROM pg_proc WHERE proowner = role.oid) FROM pg_roles AS role WHERE role.rolname = 'openbot_runtime'")"
          test "$runtime_owned_objects" = '0'

          if docker compose exec -T -e PGPASSWORD=replace-runtime-me postgres psql \
            --host 127.0.0.1 --username openbot_runtime --dbname openbot \
            --set=ON_ERROR_STOP=1 --command 'SET ROLE openbot_runtime_elevated' \
            >/tmp/openbot-runtime-set-role.out 2>&1; then
            echo 'The API database role unexpectedly retained an elevated role membership.' >&2
            exit 1
          fi
          grep --extended-regexp --ignore-case --quiet \
            'permission denied to set role|must be member of role' \
            /tmp/openbot-runtime-set-role.out

          database_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_database_privilege('openbot_runtime', current_database(), 'CONNECT'), has_database_privilege('openbot_runtime', current_database(), 'CREATE'), has_database_privilege('openbot_runtime', current_database(), 'TEMPORARY'))")"
          test "$database_privileges" = 't,f,f'

          schema_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_schema_privilege('openbot_runtime', 'public', 'USAGE'), has_schema_privilege('openbot_runtime', 'public', 'CREATE'))")"
          test "$schema_privileges" = 't,f'

          migration_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT concat_ws(',', has_table_privilege('openbot_runtime', 'openbot_schema_migrations', 'SELECT'), has_table_privilege('openbot_runtime', 'openbot_schema_migrations', 'INSERT'), has_table_privilege('openbot_runtime', 'openbot_schema_migrations', 'UPDATE'), has_table_privilege('openbot_runtime', 'openbot_schema_migrations', 'DELETE'), has_table_privilege('openbot_runtime', 'openbot_schema_migrations', 'TRUNCATE'))")"
          test "$migration_table_privileges" = 't,f,f,f,f'

          application_table_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
            --command "SELECT string_agg(table_name || ':' || concat_ws(',', has_table_privilege('openbot_runtime', table_name, 'SELECT'), has_table_privilege('openbot_runtime', table_name, 'INSERT'), has_table_privilege('openbot_runtime', table_name, 'UPDATE'), has_table_privilege('openbot_runtime', table_name, 'DELETE'), has_table_privilege('openbot_runtime', table_name, 'TRUNCATE')), ';' ORDER BY table_name) FROM (VALUES ('instance_claims'), ('local_credentials'), ('sessions'), ('users'), ('workspace_memberships'), ('workspaces')) AS application_tables(table_name)")"
          test "$application_table_privileges" = 'instance_claims:t,t,f,f,f;local_credentials:t,t,f,f,f;sessions:t,t,f,f,f;users:t,t,f,f,f;workspace_memberships:t,t,f,t,f;workspaces:t,t,f,f,f'

          membership_update_privileges="$(docker compose exec -T postgres psql \
            --username openbot --dbname openbot --tuples-only --no-align \
